name: Kudus Bilinci Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: ZIP dosyasini ac
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          echo "Bulunan ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          find extracted -maxdepth 3 -type f

      - name: Site klasorunu bul
        id: site
        shell: bash
        run: |
          INDEX_FILE="$(find extracted -type f -name 'index.html' | head -n 1)"
          if [ -z "$INDEX_FILE" ]; then
            echo "index.html bulunamadi"
            exit 1
          fi
          SITE_DIR="$(dirname "$INDEX_FILE")"
          echo "index.html bulundu: $INDEX_FILE"
          echo "Yayin klasoru: $SITE_DIR"
          echo "site_dir=$SITE_DIR" >> "$GITHUB_OUTPUT"

      - name: Pages ayarla
        uses: actions/configure-pages@v5

      - name: Siteyi hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.site_dir }}

      - name: Yayina al
        id: deployment
        uses: actions/deploy-pages@v4
