// Hafif PostgREST istemcisi: harici JS/CDN gerektirmez.
// Publishable key yalnızca apikey başlığında gönderilir.
class RestQuery {
  constructor(table, method='GET', body=null, mode='normal', conflict=''){
    this.table=table; this.method=method; this.body=body; this.mode=mode; this.conflict=conflict;
    this.params=[]; this.prefer=[]; this.wantSingle=false; this.wantSelect=false;
  }
  select(cols='*'){this.params.push(['select',cols]);this.wantSelect=true;return this}
  order(col,opt={}){this.params.push(['order',`${col}.${opt.ascending===false?'desc':'asc'}`]);return this}
  eq(col,val){this.params.push([col,`eq.${val}`]);return this}
  single(){this.wantSingle=true;return this}
  async exec(){
    let url=new URL(`${SUPABASE_URL}/rest/v1/${this.table}`);
    for(const [k,v] of this.params) url.searchParams.append(k,v);
    if(this.conflict) url.searchParams.set('on_conflict',this.conflict);
    const headers={'apikey':SUPABASE_KEY,'Accept':'application/json'};if(authToken())headers['Authorization']=`Bearer ${authToken()}`;
    if(this.method!=='GET' && this.method!=='DELETE') headers['Content-Type']='application/json';
    if(this.mode==='upsert') this.prefer.push('resolution=merge-duplicates');
    if(this.wantSelect) this.prefer.push('return=representation');
    if(this.prefer.length) headers['Prefer']=[...new Set(this.prefer)].join(',');
    let res;
    try{
      const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),7000);
      try{res=await fetch(url.toString(),{method:this.method,headers,body:this.body==null?undefined:JSON.stringify(this.body),signal:controller.signal})}
      finally{clearTimeout(timer)};
    }catch(e){return {data:null,error:{message:'Supabase ağına ulaşılamadı: '+e.message}}}
    let raw=''; try{raw=await res.text()}catch{}
    let payload=null; if(raw){try{payload=JSON.parse(raw)}catch{payload=raw}}
    if(!res.ok){let msg=payload?.message||payload?.hint||payload?.error||String(payload||`HTTP ${res.status}`);return {data:null,error:{message:msg,status:res.status}}}
    let data=payload;
    if(this.wantSingle && Array.isArray(data)) data=data[0]||null;
    return {data,error:null};
  }
  then(resolve,reject){return this.exec().then(resolve,reject)}
}
const db={
  from(table){return {
    select(cols='*'){return new RestQuery(table).select(cols)},
    insert(body){return new RestQuery(table,'POST',body)},
    update(body){return new RestQuery(table,'PATCH',body)},
    delete(){return new RestQuery(table,'DELETE')},
    upsert(body,opt={}){return new RestQuery(table,'POST',body,'upsert',opt.onConflict||'')}
  }}
};
async function rpc(name,args={}){
  try{
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),7000);let r;
    try{r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${authToken()}`,'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(args),signal:controller.signal})}finally{clearTimeout(timer)};
    let raw=await r.text(),data=raw?JSON.parse(raw):null;if(!r.ok)return{data:null,error:{message:data?.message||raw||'RPC hatası'}};return{data,error:null}
  }catch(e){return{data:null,error:{message:e.message}}}
}

function loginMember(id){
  let m=S.members.find(x=>x.id===id&&x.active);if(!m)return;
  document.body.classList.remove('preauth');S.current=m;localStorage.setItem('kbd-member',m.id);
  S.page='home';location.hash='#/home';render();loadAppData()
}
function presidentLogin(){
  openModal(`<h2>🧕🏻 Başkan Girişi</h2>
    <p class="muted">Başkan yönetim parolasını girin.</p>
    <form onsubmit="submitPresidentLogin(event)">
      <label class="field"><span>Başkan parolası</span>
        <input id="presidentPassword" class="input" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn" style="width:100%">Başkan Paneline Gir</button>
    </form>`)
}
async function submitPresidentLogin(e){
  e.preventDefault();
  const button=e.submitter;if(button){button.disabled=true;button.textContent='Kontrol ediliyor…'}
  let p=val('presidentPassword');
  let res=await rpc('verify_president_password',{p_password:p});
  if(button){button.disabled=false;button.textContent='Başkan Paneline Gir'}
  if(res.error)return alert('Başkan girişi kontrol edilemedi: '+res.error.message);
  if(res.data!==true)return alert('Başkan parolası yanlış.');
  let m=S.members.find(x=>x.role==='baskan'&&x.active);
  if(!m)return alert('Aktif başkan hesabı bulunamadı.');
  closeModal();
  document.body.classList.remove('preauth');
  S.presidentUnlocked=true;
  sessionStorage.setItem('kbd-president-ok','1');
  S.current=m;
  localStorage.setItem('kbd-member',m.id);
  S.page='president';
  location.hash='#/president';
  render();
  loadAppData()
}
function logout(){localStorage.removeItem('kbd-member');sessionStorage.removeItem('kbd-president-ok');S.presidentUnlocked=false;S.current=null;S.page='home';location.hash='';render()}

function activePolls(){
  let now=Date.now();
  return S.polls.filter(p=>p.isActive&&(!p.deadline||new Date(p.deadline).getTime()>=now)).sort((a,b)=>(b.isPinned-a.isPinned)||new Date(b.created)-new Date(a.created))
}
function activeAnnouncements(){
  let now=Date.now();
  return S.announcements.filter(a=>!a.expiresAt||new Date(a.expiresAt).getTime()>=now).sort((a,b)=>(b.isPinned-a.isPinned)||new Date(b.created)-new Date(a.created))
}
function pollOptions(id){return S.pollOptions.filter(x=>x.pollId===id).sort((a,b)=>a.sort-b.sort)}
function pollVoteFor(id,memberId=S.current?.id){return S.pollVotes.find(v=>v.pollId===id&&v.memberId===memberId)}
function pollCount(optionId){return S.pollVotes.filter(v=>v.optionId===optionId).length}
function pollVoterNames(optionId){return S.pollVotes.filter(v=>v.optionId===optionId).map(v=>S.members.find(m=>m.id===v.memberId)?.name).filter(Boolean)}
function renderPollWidget(p){
  let opts=pollOptions(p.id),mine=pollVoteFor(p.id),total=S.pollVotes.filter(v=>v.pollId===p.id).length;
  return `<div class="dashboard-widget poll"><div class="row"><div><div class="widget-kicker">📊 Başkan Anketi</div><h3>${esc(p.title||'Anket')}</h3></div>${p.deadline?`<small class="muted">${fmt(p.deadline)}</small>`:''}</div><p>${esc(p.question||'')}</p><div>${opts.map(o=>{let c=pollCount(o.id),pct=total?Math.round(c/total*100):0,names=pollVoterNames(o.id);return `<button class="poll-option ${mine?.optionId===o.id?'selected':''}" onclick="votePoll('${p.id}','${o.id}')"><span style="flex:1"><b>${esc(o.label)}</b><div class="poll-bar"><i style="width:${pct}%"></i></div><span class="voter-names">${names.length?`Oy verenler: ${esc(names.join(', '))}`:'Henüz oy yok'}</span></span><small>${c} oy</small></button>`}).join('')}</div><div class="row" style="margin-top:8px"><small class="muted">${mine?'Oyun kaydedildi. Başka seçeneğe basarak değiştirebilirsin.':'Bir seçenek seçerek oy ver.'}</small><small class="muted">${total} oy</small></div>${S.current?.role==='baskan'?`<div class="widget-actions"><button onclick="closePoll('${p.id}')">Anketi kapat</button></div>`:''}</div>`
}
function renderAnnouncementWidget(a){
  let icon=a.kind==='reminder'?'⏰':'📣',cls=a.kind==='reminder'?'reminder':'announcement';
  return `<div class="dashboard-widget ${cls}"><div class="widget-kicker">${icon} ${a.kind==='reminder'?'Hatırlatma':'Duyuru'}</div><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p>${a.eventAt?`<div class="tag track">📅 ${dt(a.eventAt)}</div>`:''}${S.current?.role==='baskan'?`<div class="widget-actions"><button onclick="deleteAnnouncement('${a.id}')">Kaldır</button></div>`:''}</div>`
}
async function votePoll(pollId,optionId){
  if(!S.current)return;
  let r=await db.from('poll_votes').upsert({poll_id:pollId,option_id:optionId,member_id:S.current.id},{onConflict:'poll_id,member_id'});
  if(r.error)return alert(r.error.message);
  await loadAppData()
}
async function closePoll(id){if(!confirm('Anket kapatılsın mı?'))return;let r=await db.from('polls').update({is_active:false}).eq('id',id);if(r.error)return alert(r.error.message);await loadAppData()}
async function deleteAnnouncement(id){
  if(!confirm('Bu duyuru/hatırlatma kaldırılsın mı?'))return;
  let a=S.announcements.find(x=>x.id===id);
  await db.from('notifications').delete().eq('source_type','announcement').eq('source_id',id);
  if(a)await db.from('notifications').delete().eq('type',a.kind).eq('message',`Başkan: ${a.title}`);
  let r=await db.from('announcements').delete().eq('id',id);
  if(r.error)return alert(r.error.message);
  await loadAppData()
}



function v713WeeklySummary(){
  const weekAgo=Date.now()-7*24*60*60*1000;
  const posts=(S.posts||[]).filter(x=>new Date(x.created).getTime()>=weekAgo).length;
  const reports=(S.reports||[]).filter(x=>new Date(x.created).getTime()>=weekAgo).length;
  const updates=(S.updates||[]).filter(x=>new Date(x.created||x.createdAt||0).getTime()>=weekAgo).length;
  return `<div class="week-summary"><div class="week-stat"><b>${posts}</b><small>Paylaşım</small></div><div class="week-stat"><b>${reports}</b><small>Rapor</small></div><div class="week-stat"><b>${updates}</b><small>Gelişme</small></div></div>`;
}
function v713Search(q){
  const box=document.getElementById('v713SearchResults');if(!box)return;
  q=(q||'').trim().toLocaleLowerCase('tr');
  if(q.length<2){box.innerHTML='';return}
  const rows=[];
  (S.projects||[]).forEach(x=>{if((x.name||'').toLocaleLowerCase('tr').includes(q))rows.push({t:'Proje',v:x.name,go:"projects"})});
  (S.members||[]).forEach(x=>{if((x.name||'').toLocaleLowerCase('tr').includes(q))rows.push({t:'Ekip',v:x.name,go:"team"})});
  (S.reports||[]).forEach(x=>{if(((x.title||'')+' '+(x.body||'')).toLocaleLowerCase('tr').includes(q))rows.push({t:'Rapor',v:x.title||'Rapor',go:"feed"})});
  (S.posts||[]).forEach(x=>{if((x.body||'').toLocaleLowerCase('tr').includes(q))rows.push({t:'Paylaşım',v:(x.body||'').slice(0,80),go:"feed"})});
  box.innerHTML=rows.slice(0,8).map(x=>`<button class="search-result" style="text-align:left;width:100%" onclick="go('${x.go}')"><small class="muted">${x.t}</small><div>${esc(x.v)}</div></button>`).join('')||'<div class="empty">Sonuç bulunamadı.</div>';
}

function v712HomePriority(){
  const polls=(S.polls||[]).filter(p=>p.active!==false).slice(0,2);
  const presidentId=(S.members||[]).find(m=>m.role==='baskan')?.id;
  const presidentPosts=(S.posts||[]).filter(p=>p.memberId===presidentId).slice(0,2);
  const anns=(S.notifications||[]).filter(n=>n.type==='announcement').slice(0,3);
  const items=[];
  polls.forEach(p=>items.push(`<div class="priority-item president"><b>📊 Başkan Anketi</b><div style="margin-top:5px">${esc(p.question||p.title||'Yeni anket')}</div><button class="btn soft" style="margin-top:9px" onclick="go('notifications')">Ankete Git</button></div>`));

  return items.slice(0,5).join('')||'<div class="empty">Şu anda öne çıkan yeni bir ekip duyurusu yok.</div>';
}

function storagePath(f){
  let s=f?.fileUrl||'';
  if(!s)return '';
  let marker='/storage/v1/object/public/project-files/';
  if(s.includes(marker))return s.split(marker)[1];
  marker='/storage/v1/object/authenticated/project-files/';
  if(s.includes(marker))return s.split(marker)[1];
  return s.replace(/^\/+/,'')
}
async function openProjectFile(id){
  let f=S.files.find(x=>x.id===id);if(!f)return;
  if(f.externalUrl){window.open(f.externalUrl,'_blank','noopener');return}
  let path=storagePath(f);if(!path)return alert('Dosya yolu bulunamadı.');
  let r=await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/project-files/${path}`,{
    headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${authToken()}`}
  });
  if(!r.ok)return alert('Dosya açılamadı.');
  let blob=await r.blob(),url=URL.createObjectURL(blob);window.open(url,'_blank','noopener');
  setTimeout(()=>URL.revokeObjectURL(url),60000)
}
function fileRow(f){return `<div class="file-chip"><button class="btn soft" style="max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="openProjectFile('${f.id}')">${f.externalUrl?'🔗':'📎'} ${esc(f.fileName||'Bağlantı')}</button>${S.current?.role==='baskan'?`<button class="btn danger" style="padding:6px 9px" onclick="deleteFile('${f.id}')">Sil</button>`:''}</div>`}

async function markRead(id){
  if(!S.current)return;
  let r=await db.from('notification_reads').upsert({notification_id:id,member_id:S.current.id,read_at:new Date().toISOString()},{onConflict:'notification_id,member_id'});
  if(r.error)return alert(r.error.message);
  let n=S.notifications.find(x=>x.id===id);if(n)n.read=true;
  render()
}
async function markAll(){
  if(!S.current)return;
  let unread=visibleNotifications().filter(n=>!n.read);
  if(!unread.length)return;
  let rows=unread.map(n=>({notification_id:n.id,member_id:S.current.id,read_at:new Date().toISOString()}));
  let r=await db.from('notification_reads').upsert(rows,{onConflict:'notification_id,member_id'});
  if(r.error)return alert(r.error.message);
  unread.forEach(n=>n.read=true);render()
}

async function saveReport(e,id=''){
  e.preventDefault();
  let row={title:val('repTitle').trim(),meeting_date:val('repDate'),body:val('repBody'),is_published:document.getElementById('repPublished').checked,created_by:S.current.id,updated_at:new Date().toISOString()};

  else result=await db.from('reports').insert({...row,created_at:new Date().toISOString()}).select('id,title,is_published').single();

  if(!id&&result.data.is_published){
    await db.from('notifications').insert({title:'Yeni toplantı raporu',message:`Yeni rapor yayınlandı: ${result.data.title}`,type:'report',source_type:'report',source_id:result.data.id,is_read:false});

  }

}
async function deleteReport(id){

  let r=await db.from('reports').delete().eq('id',id);if(r.error)return alert(r.error.message);
  await loadAppData();go('reports')
}

      <input id="commonPassAgain" class="input" type="password" autocomplete="new-password">

    <p id="commonPassStatus" class="muted" style="margin-top:10px"></p>`)

async function changeCommonPassword(){
  if(!S.current || S.current.role!=='baskan'){
    alert('Bu işlem yalnızca başkan hesabından yapılabilir.');
    return;
  }

  const current=document.getElementById('commonPassCurrent')?.value||'';
  const next=document.getElementById('commonPassNew')?.value||'';
  const again=document.getElementById('commonPassAgain')?.value||'';

  if(!current||!next||!again){
    showCommonPassStatus('Üç alanı da doldurun.', true);
    return;
  }
  if(next.length<10){
    showCommonPassStatus('Yeni parola en az 10 karakter olmalıdır.', true);
    return;
  }
  if(next!==again){
    showCommonPassStatus('Yeni parolalar eşleşmiyor.', true);
    return;
  }
  if(current===next){
    showCommonPassStatus('Yeni parola mevcut paroladan farklı olmalıdır.', true);
    return;
  }

  const btn=document.getElementById('commonPassBtn');
  if(btn){btn.disabled=true;btn.textContent='Güncelleniyor…'}
  showCommonPassStatus('Mevcut parola doğrulanıyor…');

  try{
    // 1. Mevcut parola ile yepyeni, yakın tarihli bir oturum aç.
    const login=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_KEY,
        'Content-Type':'application/json',
        'Accept':'application/json'
      },
      body:JSON.stringify({
        email:SHARED_AUTH_EMAIL,
        password:current
      })
    });

    const loginRaw=await login.text();
    let auth={};try{auth=loginRaw?JSON.parse(loginRaw):{}}catch{}
    if(!login.ok || !auth.access_token){
      throw new Error('Mevcut ortak parola doğru değil.');
    }

    showCommonPassStatus('Yeni parola kaydediliyor…');

    // 2. Supabase Auth: giriş yapmış kullanıcı kendi parolasını günceller.
    // Resmî updateUser akışının REST karşılığı.
    const upd=await fetch(`${SUPABASE_URL}/auth/v1/user`,{
      method:'PUT',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':`Bearer ${auth.access_token}`,
        'Content-Type':'application/json',
        'Accept':'application/json'
      },
      body:JSON.stringify({
        password:next
      })
    });

    const updRaw=await upd.text();
    let out={};try{out=updRaw?JSON.parse(updRaw):{}}catch{}
    if(!upd.ok){
      const detail=out?.msg||out?.message||out?.error_description||updRaw||`HTTP ${upd.status}`;
      throw new Error('Parola güncellenemedi: '+detail);
    }

    showCommonPassStatus('Yeni parola doğrulanıyor…');

    // 3. Değişikliğin gerçekten gerçekleştiğini yeni parola ile giriş yaparak doğrula.
    const verify=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_KEY,
        'Content-Type':'application/json',
        'Accept':'application/json'
      },
      body:JSON.stringify({
        email:SHARED_AUTH_EMAIL,
        password:next
      })
    });

    const verifyRaw=await verify.text();
    let fresh={};try{fresh=verifyRaw?JSON.parse(verifyRaw):{}}catch{}
    if(!verify.ok || !fresh.access_token){
      throw new Error('Parola kaydedildi ancak yeni oturum doğrulanamadı. Çıkış yapıp yeni parolayla tekrar deneyin.');
    }

    // Yeni oturumu sakla.
    saveAuthSession(fresh);

    ['commonPassCurrent','commonPassNew','commonPassAgain'].forEach(id=>{
      const el=document.getElementById(id);if(el)el.value='';
    });

    showCommonPassStatus('Ortak giriş parolası başarıyla güncellendi.');
    alert('Ortak giriş parolası başarıyla güncellendi.'); closeModal();

  }catch(e){
    showCommonPassStatus(e.message||'Parola güncellenemedi.', true);
    alert(e.message||'Parola güncellenemedi.');
  }finally{
    if(btn){
      btn.disabled=false;
      btn.textContent='Ortak Giriş Parolasını Güncelle';
    }
  }
}

function showCommonPassStatus(message,isError=false){
  const el=document.getElementById('commonPassStatus');
  if(!el)return;
  el.textContent=message||'';
  el.style.color=isError?'#963737':'#315f3c';

function v7SmartHealth(p){
  if(!p)return 'on_track';
  if(p.progress>=100||p.health==='done'||p.status==='tamamlandi')return 'done';
  if(!p.due)return p.health==='delayed'?'delayed':p.health==='at_risk'?'at_risk':'on_track';
  const now=new Date(),due=new Date(String(p.due).slice(0,10)+'T23:59:59');
  const days=(due-now)/86400000;
  if(days<0)return 'delayed';
  let expected=0;
  if(p.start){
    const st=new Date(String(p.start).slice(0,10)+'T00:00:00'), total=due-st;
    if(total>0)expected=Math.max(0,Math.min(100,((now-st)/total)*100));
  }
  if(days<=2 || (expected>0 && p.progress+25<expected))return 'at_risk';
  if(days<=7)return 'approaching';
  return 'on_track'
}
function v7HealthLabel(h){return {on_track:'🟢 Yolunda',approaching:'🟡 Süre Yaklaşıyor',at_risk:'🟠 Riskli',delayed:'🔴 Gecikmiş',done:'🔵 Tamamlandı'}[h]||'🟢 Yolunda'}

function v7WeeklyWorker(){
  const scores={};
  const add=(id,n=1)=>{if(id)scores[id]=(scores[id]||0)+n};
  S.updates.filter(x=>String(x.weekStart||'').slice(0,10)===v7WeekStart()).forEach(x=>add(x.memberId));
  S.posts.filter(x=>v7ThisWeek(x.created)).forEach(x=>add(x.memberId));
  S.files.filter(x=>v7ThisWeek(x.created)).forEach(x=>add(x.memberId));
  S.comments.filter(x=>v7ThisWeek(x.created)).forEach(x=>add(x.memberId));
  let top=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  if(!top)return null;
  return {member:v7Member(top[0]),count:top[1]}
}

// ---------- Secure object upload/open ----------
async function v7UploadObject(file,prefix='uploads'){
  let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${prefix}/${Date.now()}-${safe}`;
  let r=await fetch(`${SUPABASE_URL}/storage/v1/object/project-files/${path}`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${authToken()}`,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});
  if(!r.ok)throw new Error(await r.text());return path
}
async function v7OpenObject(path,external=''){
  if(external){window.open(external,'_blank','noopener');return}
  let tab=window.open('about:blank','_blank');
  try{
    let r=await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/project-files/${path}`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${authToken()}`}});
    if(!r.ok)throw new Error(await r.text());
    let blob=await r.blob(),url=URL.createObjectURL(blob);
    if(tab)tab.location.href=url;else window.location.href=url;
    setTimeout(()=>URL.revokeObjectURL(url),120000)
  }catch(e){if(tab)tab.close();alert('Dosya açılamadı: '+e.message)}
}
async function openProjectFile(id){
  let f=S.files.find(x=>x.id===id);if(!f)return;
  if(f.externalUrl)return v7OpenObject('',f.externalUrl);
  return v7OpenObject(storagePath(f))
}

function v74AttendanceSessionForDate(date){
  return S.attendanceSessions.find(x=>String(x.meetingDate).slice(0,10)===String(date).slice(0,10))
}
function v74AttendanceEntries(sessionId){
  return S.attendanceEntries.filter(x=>x.sessionId===sessionId)
}
function v74AttendanceStatus(sessionId,memberId){
  return v74AttendanceEntries(sessionId).find(x=>x.memberId===memberId)?.status||''
}
function v74AttendanceSummary(sessionId){
  let e=v74AttendanceEntries(sessionId);
  return {
    present:e.filter(x=>x.status==='present').length,
    absent:e.filter(x=>x.status==='absent').length,
    leave:e.filter(x=>x.status==='leave').length
  }
}
async function v74EnsureAttendanceSession(date,reportId=''){
  let existing=v74AttendanceSessionForDate(date);
  if(existing)return existing;
  let r=await db.from('attendance_sessions').insert({
    meeting_date:String(date).slice(0,10),
    report_id:reportId||null,
    created_by:S.current?.id||null,
    created_at:new Date().toISOString()
  }).select('*').single();
  if(r.error){alert(r.error.message);return null}
  let s={id:r.data.id,meetingDate:r.data.meeting_date,reportId:r.data.report_id,createdBy:r.data.created_by,created:r.data.created_at};
  S.attendanceSessions.push(s);
  return s
}
async function v74SetAttendance(sessionId,memberId,status){
  let r=await db.from('attendance_entries').upsert({
    session_id:sessionId,
    member_id:memberId,
    status,
    updated_at:new Date().toISOString()
  },{onConflict:'session_id,member_id'});
  if(r.error)return alert(r.error.message);
  let ex=S.attendanceEntries.find(x=>x.sessionId===sessionId&&x.memberId===memberId);
  if(ex){ex.status=status;ex.updated=new Date().toISOString()}
  else S.attendanceEntries.push({sessionId,memberId,status,updated:new Date().toISOString()});
  render();
}
function v74AttendanceBlock(date,reportId=''){
  let s=v74AttendanceSessionForDate(date);
  if(!s){
    if(S.current?.role==='baskan'){
      return `<div class="card attendance-card"><div class="row"><div><b>🗓 Yoklama Listesi</b><small class="muted" style="display:block">${fmt(date)}</small></div><button class="btn soft" onclick="v74CreateAttendance('${String(date).slice(0,10)}','${reportId}')">Yoklamayı Oluştur</button></div></div>`
    }
    return ''
  }
  let sum=v74AttendanceSummary(s.id);
  return `<div class="card attendance-card">
    <div class="row"><div><b>🗓 Yoklama Listesi</b><small class="muted" style="display:block">Toplantı tarihi: ${fmt(s.meetingDate)}</small></div>
      <div class="att-summary"><span class="tag active">✓ ${sum.present}</span><span class="tag late">✕ ${sum.absent}</span><span class="tag track">İzinli ${sum.leave}</span></div>
    </div>
    <div class="attendance-grid">
      ${S.members.filter(m=>m.active&&m.role!=='baskan').map(m=>{
        let st=v74AttendanceStatus(s.id,m.id);
        return `<div class="attendance-row">${avatar(m)}<span class="name">${esc(m.name)}</span>
          ${S.current?.role==='baskan'?`
          <button class="att-btn present ${st==='present'?'on':''}" onclick="v74SetAttendance('${s.id}','${m.id}','present')">Var</button>
          <button class="att-btn absent ${st==='absent'?'on':''}" onclick="v74SetAttendance('${s.id}','${m.id}','absent')">Yok</button>
          <button class="att-btn leave ${st==='leave'?'on':''}" onclick="v74SetAttendance('${s.id}','${m.id}','leave')">İzinli</button>`:
          `<span class="tag ${st==='present'?'active':st==='absent'?'late':'track'}">${st==='present'?'Var':st==='absent'?'Yok':st==='leave'?'İzinli':'—'}</span>`}
        </div>`

    </div>
  </div>`
}

function v8IsImage(name='',type=''){return String(type).startsWith('image/')||/\.(png|jpe?g|gif|webp|heic|avif)$/i.test(name||'')}
function v8Media(path,name='Dosya',type='',external=''){
  if(external){if(v8IsImage(name,type)||/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(external))return `<div class="v8-media"><img src="${esc(external)}" alt="${esc(name)}" onclick="v8Lightbox(this.src)"></div>`;return `<a class="media-file" href="${esc(external)}" target="_blank">🔗 ${esc(name)}</a>`}
  if(!path)return '';if(v8IsImage(name,type))return `<div class="v8-media" data-v8-path="${esc(path)}"><span class="muted">🖼 Görsel yükleniyor…</span></div>`;return `<button class="media-file" onclick="v7OpenObject('${esc(path)}')">📎 ${esc(name)}</button>`
}
async function v8HydrateMedia(root=document){for(const el of [...(root.querySelectorAll?.('.v8-media[data-v8-path]')||[])]){if(el.dataset.done==='1')continue;el.dataset.done='1';try{let r=await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/project-files/${el.dataset.v8Path}`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${authToken()}`}});if(!r.ok)throw 0;let blob=await r.blob(),url=URL.createObjectURL(blob);el.innerHTML=`<img src="${url}" alt="Görsel" onclick="v8Lightbox(this.src)">`}catch{el.innerHTML='<span class="muted">Önizleme açılamadı.</span>'}}}
function v8Lightbox(url){const x=document.createElement('div');x.className='v8-lightbox';x.innerHTML=`<img src="${url}" alt="Görsel">`;x.onclick=()=>x.remove();document.body.appendChild(x)}
if(!window.__v8MediaObserver){window.__v8MediaObserver=new MutationObserver(()=>v8HydrateMedia());window.__v8MediaObserver.observe(document.documentElement,{childList:true,subtree:true})}
let v8ReplyTo=null;
function v8StartReply(id){const m=S.chatMessages.find(x=>String(x.id)===String(id));if(!m)return;const u=v7Member(m.memberId);v8ReplyTo={id:m.id,name:u?.name||'Üye',body:m.body||''};const b=document.getElementById('v8Replying');if(b){b.style.display='block';b.innerHTML=`↩ <b>${esc(v8ReplyTo.name)}</b>: ${esc(v8ReplyTo.body.slice(0,75))} <button type="button" onclick="v8CancelReply()">×</button>`}document.getElementById('v7ChatBody')?.focus()}

function v8ReplyPreview(m){if(!m.replyToId)return '';const q=S.chatMessages.find(x=>String(x.id)===String(m.replyToId));if(!q)return '';const u=v7Member(q.memberId);return `<div class="chat-reply-preview"><b>${esc(u?.name||'Üye')}</b><br>${esc((q.body||'Dosya').slice(0,90))}</div>`}

// ---------- V7 load override ----------
async function loadAppData(){
  if(S.appLoading)return;
  S.appLoading=true;S.dataReady=false;const errors=[];
  async function q(label,promise){try{const r=await promise;if(r.error)throw r.error;return r.data||[]}catch(e){console.error(label,e);errors.push(label+': '+(e.message||e));return[]}}
  try{
    const [ud,pd,pmd,wd]=await Promise.all([q('Birimler',db.from('units').select('*').order('name')),q('Projeler',db.from('projects').select('*').order('created_at',{ascending:false})),q('Proje üyeleri',db.from('project_members').select('*')),q('Haftalık gelişmeler',db.from('weekly_updates').select('*').order('created_at',{ascending:false}))]);
    S.updates=wd.map(x=>({id:x.id,projectId:x.project_id,memberId:x.member_id,createdAt:x.created_at,updated:x.updated_at,weekStart:x.week_start,did:x.completed||x.current_status||'',blocker:x.blockers||'',next:x.next_week_goal||'',progress:x.progress||0}));
    let byP={};S.updates.forEach(x=>(byP[x.projectId]??=[]).push(x));S.members=S.members.map(x=>({...x,last:S.updates.find(z=>z.memberId===x.id)?.createdAt||null}));
    S.units=ud.map(x=>({id:x.id,name:x.name,note:x.description||x.note||''}));
    S.projects=pd.map(x=>{let list=byP[x.id]||[],a=list[0],b=list[1],status=normalizeStatus(x.status);return{id:x.id,unitId:x.unit_id,name:x.name,desc:x.description||'',status,health:normalizeHealth(x.health_status,status),progress:x.progress||0,start:x.start_date,due:x.target_date||'',updated:x.updated_at||x.created_at,thisWeek:a?.did||'Bu hafta henüz gelişme girilmedi.',lastWeek:b?.did||'—',nextWeek:a?.next||'Henüz hedef girilmedi.',support:a?.blocker||''}});
    S.pm=pmd.map(x=>({projectId:x.project_id,memberId:x.member_id}));S.dataReady=true;render()

function v71B64ToUint8(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))
}

function v71UnreadChat(){
  if(!S.current||!S.chatLastRead)return 0;
  const last=new Date(S.chatLastRead);
  if(Number.isNaN(last.getTime()))return 0;
  return S.chatMessages.filter(m=>m.memberId!==S.current.id&&new Date(m.created)>last).length
}
async function v71LoadChatRead(){
  if(!S.current)return;

  if(!r.error&&r.data){S.chatLastRead=r.data.last_read_at}
  else{
    const now=new Date().toISOString();
    S.chatLastRead=now;
    await db.from('chat_reads').upsert({member_id:S.current.id,last_read_at:now},{onConflict:'member_id'});
